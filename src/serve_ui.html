<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAN Scan</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LAN Scan">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#0b1020; --panel:#0d1526; --panel2:#131d33; --line:rgba(103,232,249,.14);
    --ink:#c8d3ea; --dim:#7d8aa6; --cyan:#67e8f9; --green:#4ade80; --orange:#f9a03c; --red:#ff8f8f;
    --mono:"SF Mono","JetBrains Mono","Fira Code",ui-monospace,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(120% 120% at 70% -10%,#101a30 0%,var(--bg) 55%);
    color:var(--ink);font-family:var(--sans);min-height:100vh;padding:28px 20px 48px}
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
  .wrap{max-width:1080px;margin:0 auto;position:relative}
  header{display:flex;align-items:center;gap:14px;margin-bottom:4px}
  .logo{width:48px;height:48px;border-radius:12px;box-shadow:0 8px 26px rgba(103,232,249,.22);flex:none}
  h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
  .tag{color:var(--cyan);font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
  .sub{color:var(--dim);font-size:13px;margin:14px 0 20px}
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:16px 18px;border-bottom:1px solid var(--line)}
  label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);display:block;margin-bottom:5px}
  input[type=text]{background:#0a1120;border:1px solid var(--line);color:var(--ink);font-family:var(--mono);
    font-size:14px;padding:9px 11px;border-radius:8px;outline:none;min-width:150px}
  input[type=text]:focus{border-color:var(--cyan)}
  .grow{flex:1;min-width:180px}
  button{background:var(--cyan);color:#08111f;font-weight:700;font-size:14px;border:0;cursor:pointer;
    padding:10px 18px;border-radius:8px;font-family:var(--sans)}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
  button.ghost.on{color:var(--cyan);border-color:var(--cyan)}
  button:disabled{opacity:.55;cursor:default}
  .seg{display:flex;gap:8px}
  .chk{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:13px;user-select:none}
  .status{display:flex;gap:16px;align-items:center;padding:11px 18px;font-family:var(--mono);
    font-size:13px;color:var(--dim);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .status b{color:var(--green);font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}
  .dot.live{background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.35}}
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:13.5px}
  th{text-align:left;color:var(--cyan);font-weight:600;font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;padding:12px 14px;border-bottom:1px solid var(--line)}
  td{padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap;vertical-align:middle}
  tr:hover td{background:rgba(103,232,249,.04)}
  .ip{color:#8ec9ff}.host{color:#c792ea}.ports{color:var(--green);white-space:normal}
  .muted{color:#42506b}
  .ico{font-size:16px}
  .disc{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
    border-radius:50%;vertical-align:middle;flex:none}
  .vend{display:inline-flex;align-items:center;gap:9px}
  .vend .ico{font-size:15px}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.03em}
  .pill.on{background:rgba(74,222,128,.16);color:var(--green)}
  .pill.off{background:rgba(255,143,143,.14);color:var(--red)}
  .empty{padding:40px;text-align:center;color:var(--dim)}
  /* scanning radar */
  .scanning{display:flex;flex-direction:column;align-items:center;padding:34px 0 44px}
  .radar{position:relative;width:230px;height:230px;border-radius:50%;
    background:radial-gradient(circle at 50% 50%, rgba(103,232,249,.09), transparent 72%)}
  .radar .ring{position:absolute;border:1px solid rgba(103,232,249,.18);border-radius:50%;inset:0}
  .radar .ring.r2{inset:38px}.radar .ring.r3{inset:76px}
  .radar .cross{position:absolute;background:rgba(103,232,249,.13)}
  .radar .cross.h{left:0;right:0;top:50%;height:1px}
  .radar .cross.v{top:0;bottom:0;left:50%;width:1px}
  .radar .sweep{position:absolute;inset:0;border-radius:50%;transform-origin:50% 50%;
    background:conic-gradient(from 0deg, rgba(103,232,249,.5), rgba(103,232,249,.06) 55deg, transparent 95deg);
    animation:sweep 1.6s linear infinite}
  @keyframes sweep{to{transform:rotate(360deg)}}
  .radar .core{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;
    background:var(--cyan);box-shadow:0 0 16px var(--cyan)}
  .radar .blip{position:absolute;width:8px;height:8px;margin:-4px;border-radius:50%;
    box-shadow:0 0 10px currentColor;opacity:0;animation:blip 1.6s ease-in-out infinite}
  @keyframes blip{0%,100%{opacity:0;transform:scale(.4)}28%,58%{opacity:1;transform:scale(1)}}
  .scanmsg{margin-top:24px;font-family:var(--mono);color:var(--dim);font-size:14px;letter-spacing:.03em}
  .scanmsg b{color:var(--cyan)}
  .scanmsg i{display:inline-block;width:16px;text-align:left;font-style:normal;color:var(--cyan)}
  .foot{color:#54617e;font-size:12px;text-align:center;margin-top:16px}
  mark{background:var(--cyan);color:#08111f;border-radius:3px;padding:0 1px}
  .err{color:var(--red)}
</style>
</head>

<script>
// Animated futuristic network background: drifting nodes wired by proximity,
// with a slow radar-style sweep - a living constellation behind the UI.
(() => {
  const c = document.getElementById("bg"), x = c.getContext("2d");
  let w, h, nodes, t = 0;
  const CY = "103,232,249";
  function resize(){
    w = c.width = innerWidth; h = c.height = innerHeight;
    const n = Math.min(110, Math.floor(w * h / 15000));
    nodes = Array.from({length:n}, () => ({
      x: Math.random()*w, y: Math.random()*h,
      vx: (Math.random()-.5)*.35, vy: (Math.random()-.5)*.35,
      r: Math.random()*1.4 + .8
    }));
  }
  addEventListener("resize", resize); resize();
  function frame(){
    t += .004;
    x.clearRect(0,0,w,h);
    // slow radar sweep glow from top-right
    const cx = w*.72, cy = h*-.05, ang = t, len = Math.hypot(w,h);
    const g = x.createLinearGradient(cx, cy, cx+Math.cos(ang)*len, cy+Math.sin(ang)*len);
    g.addColorStop(0, `rgba(${CY},.05)`); g.addColorStop(1, "rgba(0,0,0,0)");
    x.fillStyle = g; x.fillRect(0,0,w,h);
    for (const p of nodes){
      p.x += p.vx; p.y += p.vy;
      if (p.x<0||p.x>w) p.vx*=-1;
      if (p.y<0||p.y>h) p.vy*=-1;
    }
    for (let i=0;i<nodes.length;i++){
      for (let j=i+1;j<nodes.length;j++){
        const a=nodes[i], b=nodes[j], d=Math.hypot(a.x-b.x, a.y-b.y);
        if (d < 140){
          x.strokeStyle = `rgba(${CY},${.16*(1-d/140)})`; x.lineWidth = 1;
          x.beginPath(); x.moveTo(a.x,a.y); x.lineTo(b.x,b.y); x.stroke();
        }
      }
    }
    for (const p of nodes){
      x.fillStyle = `rgba(${CY},.6)`;
      x.beginPath(); x.arc(p.x, p.y, p.r, 0, 6.29); x.fill();
    }
    requestAnimationFrame(frame);
  }
  frame();
})();

  };
  const glyphColor = hex => {
    const r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);
    return (0.299*r+0.587*g+0.114*b)/255 > 0.68 ? "#0b1020" : "#ffffff";
  };
  const brandDisc = vendor => {
    if (!vendor) return null;
    const v = vendor.toLowerCase();
    for (const kw in BRANDS) if (v.includes(kw)) {
      const b = BRANDS[kw];
      return `<span class="disc" title="${vendor}" style="background:#${b.h}">`+
        `<svg viewBox="0 0 24 24" width="13" height="13" fill="${glyphColor(b.h)}"><path d="${b.p}"/></svg></span>`;
    }
    return null;
  };
  // Vendor cell with the brand logo (or device emoji) inline before the name.
  const vendorCell = (h, f) => {
    if (!h.vendor) return `<td class="muted">-</td>`;
    const ic = brandDisc(h.vendor) || `<span class="ico">${devEmoji(h)}</span>`;
    return `<td><span class="vend">${ic}<span>${hl(h.vendor,f)}</span></span></td>`;
  };

  // --- helpers -------------------------------------------------------------
  const esc = s => (s==null?"":String(s)).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const hl = (s,f) => { s=esc(s); if(!f) return s;
    try { return s.replace(new RegExp("("+f.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>"); }
    catch { return s; } };
  const portsText = h => (h.open_ports||[]).map(p=>p.service?`${p.port}/${p.service}`:`${p.port}`).join(", ");
  const matches = (h,f) => { if(!f) return true;
    return [h.ip,h.mac,h.hostname,h.vendor,portsText(h)].filter(Boolean).join(" ").toLowerCase().includes(f.toLowerCase()); };
  const ago = s => s<60?`${s}s ago`:s<3600?`${Math.floor(s/60)}m ago`:s<86400?`${Math.floor(s/3600)}h ago`:`${Math.floor(s/86400)}d ago`;
  const td = (v,f,cls) => v ? `<td class="${cls||""}">${hl(v,f)}</td>` : `<td class="muted">-</td>`;

  // --- live scan view ------------------------------------------------------
  function renderLive(){
    const f = $("filter").value.trim();
    const rows = hosts.filter(h=>matches(h,f));
    $("count").textContent = f ? `${rows.length}/${hosts.length}` : hosts.length;
    if(!rows.length){ $("body").innerHTML = `<div class="empty">${hosts.length?"No hosts match the filter.":"No live hosts found."}</div>`; return; }
    $("body").innerHTML = `<table><thead><tr>
      <th>IP</th><th>MAC</th><th>Hostname</th><th>Vendor</th><th>Open ports</th>
    </tr></thead><tbody>${rows.map(h=>`<tr>
      ${td(h.ip,f,"ip")}${td(h.mac,f)}${td(h.hostname,f,"host")}${vendorCell(h,f)}
      ${portsText(h)?`<td class="ports">${hl(portsText(h),f)}</td>`:`<td class="muted">-</td>`}
    </tr>`).join("")}</tbody></table>`;
  }

  // --- history / inventory view -------------------------------------------
  let inv = [], invNow = 0;
  function renderHistory(){
    const f = $("filter").value.trim();
    const rows = inv.filter(h=>matches(h,f));
    const online = rows.filter(d=>d.online).length;
    $("counts").innerHTML = `<b>${online}</b> online, ${rows.length-online} offline`;
    if(!rows.length){ $("body").innerHTML = `<div class="empty">No devices recorded yet. Run a scan first.</div>`; return; }
    $("body").innerHTML = `<table><thead><tr>
      <th>Status</th><th>IP</th><th>MAC</th><th>Hostname</th><th>Vendor</th><th>Last seen</th><th>Open ports</th>
    </tr></thead><tbody>${rows.map(h=>`<tr>
      <td>${h.online?`<span class="pill on">online</span>`:`<span class="pill off">offline</span>`}</td>
      ${td(h.ip,f,"ip")}${td(h.mac,f)}${td(h.hostname,f,"host")}${vendorCell(h,f)}
      <td class="muted">${h.online?"now":ago(Math.max(0,invNow-(h.last_seen||0)))}</td>
      ${portsText(h)?`<td class="ports">${hl(portsText(h),f)}</td>`:`<td class="muted">-</td>`}
    </tr>`).join("")}</tbody></table>`;
  }

  const render = () => mode==="live" ? renderLive() : renderHistory();

  // --- scanning radar ------------------------------------------------------
  let dotTimer = null;
  function showScanning(cidr){
    const blips = [[72,30],[30,42],[63,66],[44,74],[80,54],[24,63]];
    $("body").innerHTML = `<div class="scanning"><div class="radar">
      <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
      <span class="cross h"></span><span class="cross v"></span>
      <span class="sweep"></span><span class="core"></span>
      ${blips.map((b,i)=>{const c=i%2?"var(--orange)":"var(--green)";
        return `<span class="blip" style="left:${b[0]}%;top:${b[1]}%;background:${c};color:${c};animation-delay:${(i*0.24).toFixed(2)}s"></span>`;}).join("")}
    </div><div class="scanmsg">Scanning <b>${esc(cidr)}</b><i id="sd"></i></div></div>`;
    clearInterval(dotTimer);
    let n = 0;
    dotTimer = setInterval(() => { n = (n+1)%4; const e = $("sd"); if(e) e.textContent = ".".repeat(n); }, 380);
  }

  // --- actions -------------------------------------------------------------
  let running = false;
  async function scan(){
    if(running) return; running = true; mode="live"; setTabs();
    $("scan").disabled=true; $("dot").className="dot live"; $("state").textContent="scanning..."; $("error").textContent="";
    $("counts").innerHTML = `<b id="count">0</b> host(s)`;
    const cidr=$("cidr").value.trim(), ports=$("ports").value.trim();
    showScanning(cidr || $("cidr").placeholder || "the local network");
    const q = new URLSearchParams();
    if(cidr) q.set("cidr",cidr); if(ports) q.set("ports",ports);
    try{
      const r = await fetch("/api/scan?"+q.toString()); const data = await r.json();
      if(!r.ok || data.error) throw new Error(data.error||("HTTP "+r.status));
      hosts = data.hosts||[]; $("net").textContent = data.cidr||"-";
      $("took").textContent = data.elapsed_ms!=null ? `in ${data.elapsed_ms} ms` : ""; renderLive();
    }catch(e){ $("error").textContent=e.message; $("body").innerHTML=`<div class="empty err">Scan failed: ${esc(e.message)}</div>`; }
    finally{ clearInterval(dotTimer); running=false; $("scan").disabled=false; $("dot").className="dot"; $("state").textContent="done"; }
  }

  async function history(){
    mode="history"; setTabs(); $("state").textContent="history"; $("took").textContent=""; $("error").textContent="";
    try{
      const r = await fetch("/api/inventory"); const data = await r.json();
      inv = data.devices||[]; invNow = data.now||0;
      $("net").textContent = inv.length+" known"; renderHistory();
    }catch(e){ $("error").textContent=e.message; }
  }

  function setTabs(){ $("history").classList.toggle("on", mode==="history"); }

  let timer=null;
  function autoToggle(){ clearInterval(timer); if($("auto").checked){ scan(); timer=setInterval(scan,15000); } }

  $("scan").onclick = scan;
  $("history").onclick = history;
  $("filter").oninput = render;
  $("auto").onchange = autoToggle;
  $("cidr").addEventListener("keydown",e=>{if(e.key==="Enter")scan();});
  $("ports").addEventListener("keydown",e=>{if(e.key==="Enter")scan();});

  fetch("/api/config").then(r=>r.json()).then(c=>{ if(c.cidr) $("cidr").placeholder=c.cidr; }).catch(()=>{});
  fetch("/health").then(r=>r.json()).then(h=>{ if(h.version) $("ver").textContent="v"+h.version; }).catch(()=>{});
})();
</script>
</body>
</html>
