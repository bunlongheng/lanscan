[package]
name = "lanscan"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A pure-Rust home LAN scanner with a CLI, a live TUI, and an MCP server."
authors = ["Bunlong Heng <bheng.code@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/bunlongheng/lanscan"
homepage = "https://github.com/bunlongheng/lanscan"
keywords = ["network", "scanner", "lan", "tui", "mcp"]
categories = ["command-line-utilities", "network-programming"]
exclude = ["screenshots/", "docs/", ".github/"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
